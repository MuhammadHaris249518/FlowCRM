services:

  postgres:
    image: postgres:16-alpine
    container_name: flowcrm-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flowcrm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flowcrm"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - flowcrm-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: flowcrm-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/flowcrm?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@postgres:5432/flowcrm?schema=public"
      AI_SERVICE_URL: "http://ai-service:8000"
      INTERNAL_SERVICE_KEY: "${INTERNAL_SERVICE_KEY:-dev_internal_secret_key}"
      CLERK_PUBLISHABLE_KEY: "${CLERK_PUBLISHABLE_KEY:-${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}}"
      CLERK_SECRET_KEY: "${CLERK_SECRET_KEY}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      RESEND_FROM_EMAIL: "${RESEND_FROM_EMAIL:-}"
      RESEND_WEBHOOK_SECRET: "${RESEND_WEBHOOK_SECRET:-}"
      DEFAULT_ORG_ID_FOR_INBOUND_EMAIL: "${DEFAULT_ORG_ID_FOR_INBOUND_EMAIL:-}"
    command: sh -c "npx prisma db push --accept-data-loss --schema=src/prisma/schema.prisma && node dist/server.js"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - flowcrm-network

  ai-service:
    build:
      context: .
      dockerfile: apps/ai-service/Dockerfile
    container_name: flowcrm-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_MODEL: "${GROQ_MODEL:-llama-3.3-70b-versatile}"
      INTERNAL_SERVICE_KEY: "${INTERNAL_SERVICE_KEY:-dev_internal_secret_key}"
    networks:
      - flowcrm-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}"
        CLERK_SECRET_KEY: "${CLERK_SECRET_KEY}"
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"

    container_name: flowcrm-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}"
      CLERK_SECRET_KEY: "${CLERK_SECRET_KEY}"
    depends_on:
      - api
    networks:
      - flowcrm-network

volumes:
  postgres_data:
    driver: local

networks:
  flowcrm-network:
    driver: bridge
